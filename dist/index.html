<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="A small wall for songs worth passing on." />
    <title>resonance — songs worth passing on</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#feed">Skip to the feed</a>

    <header class="masthead">
      <h1 data-disco-target>resonance</h1>
      <p class="tagline">songs worth passing on.</p>
    </header>

    <main class="page-shell">
      <section class="composer" aria-labelledby="share-title">
        <button id="share-toggle" class="composer-toggle" type="button" aria-expanded="false" aria-controls="share-content">
          <span id="share-title">Share a song ?</span>
          <span class="toggle-arrow" aria-hidden="true"></span>
        </button>

        <div id="share-content" class="composer-content" hidden>
          <div class="song-picker">
            <div class="search-field">
              <label class="visually-hidden" for="song-search">Search songs</label>
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input id="song-search" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="Search a song or artist" aria-controls="search-results" />
              <button id="clear-search" class="clear-search" type="button" aria-label="Clear song search">×</button>
            </div>
            <div id="search-status" class="search-status" aria-live="polite"></div>
            <div id="search-results" class="search-results" role="listbox" aria-label="Song results"></div>
          </div>

          <div id="selected-track" class="selected-track" hidden></div>

          <form id="share-form" class="share-form">
            <div class="share-fields">
              <label>
                <span>Your name <em>optional</em></span>
                <input id="sender-name" type="text" maxlength="40" autocomplete="name" placeholder="Someone" />
              </label>
              <label>
                <span>A small note <em>optional</em></span>
                <input id="song-note" type="text" maxlength="280" placeholder="for the walk home" />
              </label>
              <button id="share-button" class="share-button" type="submit" disabled>Share</button>
            </div>
            <p id="share-status" class="form-status" aria-live="polite"></p>
          </form>
        </div>
      </section>

      <section id="feed" class="feed" aria-labelledby="feed-title">
        <div class="section-heading feed-heading">
          <div>
            <h2 id="feed-title">Recently shared</h2>
          </div>
          <p id="feed-count" class="section-hint"></p>
        </div>
        <div id="feed-status" class="feed-status" aria-live="polite">Loading songs…</div>
        <div id="feed-list" class="feed-list"></div>
      </section>
    </main>

    <audio id="preview-audio" preload="none"></audio>
    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
